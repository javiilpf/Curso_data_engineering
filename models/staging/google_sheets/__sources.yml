sources:
  - name: google_sheets
    database: db31_bronze_db
    tables:
      - name: budget
        columns:
          - name: _row
            data_type: number
          - name: quantity
            data_type: number
          - name: month
            data_type: date
          - name: product_id
            data_type: varchar
          - name: _fivetran_synced
            data_type: timestamp_ntz

      - name: users
        columns:
          - name: nombre
            data_type: varchar
          - name: dni
            data_type: varchar
          - name: email
            data_type: varchar
          - name: fecha_alta_sistema
            data_type: timestamp_ntz

