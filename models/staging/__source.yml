version: 2

sources:
  - name: postgres
    database: DB31_BRONZE_DB
    schema: postgres
    quoting:
      database: false
      schema: false
      identifier: false
    config:

      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 1201, period: day}

    tables:
      - name: orders
        config:
          loaded_at_field: _fivetran_synced

        columns:
          - name: ORDER_ID
          - name: SHIPPING_SERVICE
          - name: SHIPPING_COST
          - name: ADDRESS_ID
          - name: CREATED_AT
          - name: PROMO_ID
          - name: ESTIMATED_DELIVERY_AT
          - name: ORDER_COST
          - name: USER_ID
          - name: ORDER_TOTAL
          - name: DELIVERED_AT
          - name: TRACKING_ID
          - name: STATUS
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED


      - name: user
        config:
          loaded_at_field: _fivetran_synced

        columns:
          - name: NOMBRE
          - name: DNI
          - name: EMAIL
          - name: FECHA_ALTA_SISTEMA
          
      - name: addresses
        config:
          loaded_at_field: _fivetran_synced
        columns:
          - name: ADDRESS_ID
          - name: ADDRESS
          - name: ZIPCODE
          - name: STATE
          - name: COUNTRY
          - name: _FIVETRAN_DELETED
          - name: _FIVETRAN_SYNCED